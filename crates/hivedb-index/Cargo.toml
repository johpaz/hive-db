[package]
name = "hivedb-index"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Índices semánticos de HiveDB: BM25 (tantivy), ANN (HNSW propio) y fusión RRF."

[dependencies]
tantivy = { version = "0.22", default-features = false, features = ["mmap"] }
rayon = "1"
memmap2 = "0.9"
bytemuck = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
bincode = { workspace = true }
tempfile = "3"
redb = { workspace = true }

[[test]]
name = "g4_semantic"
path = "tests/g4_semantic.rs"

[[test]]
name = "g11_semantic_integrity"
path = "tests/g11_semantic_integrity.rs"

[[test]]
name = "g11c_graph_persistence"
path = "tests/g11c_graph_persistence.rs"

[[test]]
name = "g11d_vector_file"
path = "tests/g11d_vector_file.rs"
