[package]
name = "hivedb-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Binding napi-rs de HiveDB para Bun/Node.js."

[lib]
crate-type = ["cdylib"]

[features]
# Embedder local (multilingual-e5-small sobre candle). Apagado por defecto: añade
# el motor de inferencia al binario nativo.
embedder-local = ["hivedb-binding-core/embedder-local"]

[dependencies]
hivedb-binding-core = { path = "../hivedb-binding-core" }
napi = { version = "3", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "3"
serde_json = { workspace = true }
tokio = { version = "1", features = ["sync", "rt", "macros"] }

[build-dependencies]
napi-build = "2"
