name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint + Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # El binding publicado se compila con el embedder local: se lintea también así.
      - name: Run clippy (embedder local)
        run: cargo clippy -p hivedb-napi -p hivedb-py --all-targets --locked --features hivedb-napi/embedder-local,hivedb-py/embedder-local -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

  # El índice vectorial usa ficheros mapeados en memoria y rutas específicas de cada
  # sistema (en Windows no se puede borrar ni renombrar un fichero mapeado). Ubuntu
  # no ejercita esas rutas: se prueba el crate del índice también en Windows y macOS.
  test-os:
    name: Índice en ${{ matrix.os }}
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-index-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run index tests
        run: cargo test -p hivedb-index --locked

  build:
    name: Build ${{ matrix.triple }}
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            triple: linux-x64-gnu
            extra_flags: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            triple: linux-x64-musl
            extra_flags: "-x"
            need_zig: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            triple: linux-arm64-gnu
            extra_flags: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            triple: darwin-x64
            extra_flags: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            triple: darwin-arm64
            extra_flags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            triple: win32-x64-msvc
            extra_flags: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.triple }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Zig
        if: ${{ matrix.need_zig }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: ${{ matrix.need_zig }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: packages/hive-db
        run: bun install --frozen-lockfile

      - name: Build native binding
        working-directory: packages/hive-db
        shell: bash
        run: |
          # `embedder-local` incluye el embedder (multilingual-e5-small sobre candle) en
          # el binario: +~6 MB. El modelo NO viaja en el paquete; se descarga al activarlo.
          bunx napi build --platform --release \
            --target ${{ matrix.target }} \
            --manifest-path ../../crates/hivedb-napi/Cargo.toml \
            --features embedder-local \
            --output-dir . ${{ matrix.extra_flags }}

      - name: Move JS binding
        working-directory: packages/hive-db
        shell: bash
        run: mv index.js native.cjs 2>/dev/null; rm -f index.d.ts; true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.triple }}
          path: |
            packages/hive-db/hivedb-napi.*.node
            packages/hive-db/native.cjs
          if-no-files-found: error

  test-bun:
    name: Bun tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x64-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        working-directory: packages/hive-db
        run: bun install --frozen-lockfile

      - name: Download linux-x64-gnu bindings
        uses: actions/download-artifact@v4
        with:
          name: bindings-linux-x64-gnu
          path: packages/hive-db/

      - name: Build TypeScript
        working-directory: packages/hive-db
        run: bun run tsc -p tsconfig.json

      - name: Run Bun tests
        working-directory: packages/hive-db
        run: bun test

  # Comprueba con el modelo real que el embedder incluido en el binario de CADA plataforma
  # funciona de punta a punta: descarga el modelo con `prepareEmbedder` (probando la descarga
  # real, con reanudación y avance) y encuentra por significado desde Bun. El modelo (~470 MB)
  # se cachea por plataforma. darwin-x64 no tiene runner Intel: solo se compila.
  embedder-e2e:
    name: Embedder local en ${{ matrix.triple }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: linux-x64-gnu, os: ubuntu-latest, rust_tests: true }
          - { triple: linux-arm64-gnu, os: ubuntu-24.04-arm }
          - { triple: darwin-arm64, os: macos-latest }
          - { triple: win32-x64-msvc, os: windows-latest }
          # musl se ejecuta en un contenedor Alpine con Bun (el runner es glibc).
          - { triple: linux-x64-musl, os: ubuntu-latest, alpine: true }
    env:
      HIVEDB_MODEL_DIR: ${{ github.workspace }}/.model-cache
      HIVEDB_E2E_EMBEDDER: "1"
    steps:
      - uses: actions/checkout@v4

      # La clave lleva la revisión fija del modelo (hivedb-embed/src/download.rs).
      - name: Cache modelo
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: hivedb-model-614241f6-${{ matrix.triple }}

      - name: Download bindings
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.triple }}
          path: packages/hive-db/

      # Tests de Rust con el modelo real (una sola plataforma: son iguales en todas).
      - name: Install Rust toolchain
        if: ${{ matrix.rust_tests }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: ${{ matrix.rust_tests }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: embedder-e2e-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Tests del embedder con el modelo real
        if: ${{ matrix.rust_tests }}
        run: cargo test -p hivedb-embed --locked -- --include-ignored

      # --- Plataformas con runner propio ---
      - name: Setup Bun
        if: ${{ !matrix.alpine }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        if: ${{ !matrix.alpine }}
        working-directory: packages/hive-db
        run: bun install --frozen-lockfile

      # Descarga (o confirma en caché) el modelo con la API pública. Reintenta una vez por si
      # Hugging Face tiene un fallo puntual.
      - name: Preparar el modelo (prepareEmbedder)
        if: ${{ !matrix.alpine }}
        working-directory: packages/hive-db
        shell: bash
        run: |
          for attempt in 1 2; do
            bun -e "import { HiveDB } from './src/index.ts'; let last = ''; const p = await HiveDB.prepareEmbedder({ onProgress: (e) => { const pct = Math.floor((100 * e.downloaded) / e.total); const line = e.file + ' ' + pct + '%'; if (line !== last && pct % 20 === 0) console.log(line); last = line; } }); console.log(JSON.stringify(p));" && break
            echo "intento $attempt fallido"; [ "$attempt" = 2 ] && exit 1; sleep 10
          done

      - name: Bun E2E con el binario construido
        if: ${{ !matrix.alpine }}
        working-directory: packages/hive-db
        shell: bash
        run: bun test test/embedder_local.test.ts

      # --- musl: contenedor Alpine ---
      - name: Bun E2E en Alpine (musl)
        if: ${{ matrix.alpine }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w/packages/hive-db \
            -e HIVEDB_MODEL_DIR=/w/.model-cache -e HIVEDB_E2E_EMBEDDER=1 \
            oven/bun:1.4.2-alpine sh -c '
              bun install --frozen-lockfile &&
              for attempt in 1 2; do
                bun -e "import { HiveDB } from \"./src/index.ts\"; console.log(JSON.stringify(await HiveDB.prepareEmbedder()));" && break
                [ "$attempt" = 2 ] && exit 1; sleep 10
              done &&
              bun test test/embedder_local.test.ts'

  # --- Binding Python (PyPI: johpaz-hive-db) ---------------------------------------------------------
  # Una wheel `abi3` por plataforma sirve a Python >= 3.9. Se compilan con el embedder local
  # (el modelo no viaja en la wheel: se descarga al activarlo).
  wheels:
    name: Wheel ${{ matrix.name }}
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gnu, os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { name: linux-arm64-gnu, os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { name: linux-x64-musl, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: darwin-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: win32-x64-msvc, os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/hive-db-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: packages/hive-db-py/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/hive-db-py
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: packages/hive-db-py/dist/*.tar.gz
          if-no-files-found: error

  test-python:
    name: pytest (Python ${{ matrix.python }})
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x64-gnu
          path: wheels

      - name: Install
        run: |
          pip install pytest ruff
          pip install --no-index --find-links wheels johpaz-hive-db

      - name: Ruff
        working-directory: packages/hive-db-py
        run: |
          ruff check python tests
          ruff format --check python tests

      - name: pytest
        working-directory: packages/hive-db-py
        run: pytest -q

  # Igual que `embedder-e2e`, pero desde Python: descarga el modelo real con la wheel de cada
  # plataforma y busca por significado. darwin-x64 no tiene runner Intel: solo se compila.
  python-e2e:
    name: Python + embedder local en ${{ matrix.triple }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: linux-x64-gnu, os: ubuntu-latest }
          - { triple: linux-arm64-gnu, os: ubuntu-24.04-arm }
          - { triple: darwin-arm64, os: macos-latest }
          - { triple: win32-x64-msvc, os: windows-latest }
          # musl se ejecuta en un contenedor Alpine (el runner es glibc).
          - { triple: linux-x64-musl, os: ubuntu-latest, alpine: true }
    env:
      HIVEDB_MODEL_DIR: ${{ github.workspace }}/.model-cache
      HIVEDB_E2E_EMBEDDER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache modelo
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: hivedb-model-614241f6-${{ matrix.triple }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.triple }}
          path: wheels

      - uses: actions/setup-python@v5
        if: ${{ !matrix.alpine }}
        with:
          python-version: "3.12"

      - name: Install
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          pip install pytest
          pip install --no-index --find-links wheels johpaz-hive-db

      # Descarga (o confirma en caché) el modelo con la API pública; reintenta una vez.
      - name: Preparar el modelo (prepare_embedder)
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          for attempt in 1 2; do
            python -c "from hivedb import HiveDB; print(HiveDB.prepare_embedder(lambda p: None))" && break
            echo "intento $attempt fallido"; [ "$attempt" = 2 ] && exit 1; sleep 10
          done

      - name: pytest con el modelo real
        if: ${{ !matrix.alpine }}
        working-directory: packages/hive-db-py
        shell: bash
        run: pytest -q tests/test_embedder_local.py

      - name: pytest en Alpine (musl)
        if: ${{ matrix.alpine }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w/packages/hive-db-py \
            -e HIVEDB_MODEL_DIR=/w/.model-cache -e HIVEDB_E2E_EMBEDDER=1 \
            python:3.12-alpine sh -c '
              pip install -q pytest &&
              pip install -q --no-index --find-links /w/wheels johpaz-hive-db &&
              for attempt in 1 2; do
                python -c "from hivedb import HiveDB; print(HiveDB.prepare_embedder())" && break
                [ "$attempt" = 2 ] && exit 1; sleep 10
              done &&
              pytest -q tests/test_embedder_local.py'

  # Adaptadores LangChain/LangGraph (paquete aparte, Python puro): se prueban contra la wheel recién
  # construida y, con el modelo real, que HiveDBStore / HiveDBVectorStore buscan por significado.
  test-langchain:
    name: langchain-hivedb
    needs: wheels
    runs-on: ubuntu-latest
    env:
      HIVEDB_MODEL_DIR: ${{ github.workspace }}/.model-cache
      HIVEDB_E2E_EMBEDDER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache modelo
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: hivedb-model-614241f6-linux-x64-gnu

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x64-gnu
          path: wheels

      - name: Install
        run: |
          pip install ruff build
          pip install --no-index --find-links wheels johpaz-hive-db
          # --no-deps: la wheel local de hive-db ya está instalada (en un release su versión
          # coincide con la exigida por el adaptador).
          pip install --no-deps -e packages/langchain-hivedb
          pip install langchain-core pytest pytest-asyncio langchain-tests langgraph

      - name: Ruff
        working-directory: packages/langchain-hivedb
        run: |
          ruff check .
          ruff format --check .

      - name: Preparar el modelo
        run: |
          for attempt in 1 2; do
            python -c "from hivedb import HiveDB; print(HiveDB.prepare_embedder(lambda p: None))" && break
            echo "intento $attempt fallido"; [ "$attempt" = 2 ] && exit 1; sleep 10
          done

      - name: pytest
        working-directory: packages/langchain-hivedb
        run: pytest -q

      - name: Build
        working-directory: packages/langchain-hivedb
        run: python -m build --outdir dist

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: langchain-dist
          path: packages/langchain-hivedb/dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-and-test, test-os, wheels, sdist, test-python, python-e2e, test-langchain]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing; si defines el secreto PYPI_API_TOKEN se usa en su lugar
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List dist
        run: ls -l dist

      # Idempotente como el publish de npm: lo que ya está en PyPI se omite.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

      # El adaptador tiene su propio número de versión (packages/langchain-hivedb/pyproject.toml);
      # si ya está en PyPI se omite.
      - name: Download langchain-hivedb
        uses: actions/download-artifact@v4
        with:
          name: langchain-dist
          path: dist-langchain

      - name: Publish langchain-hivedb
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-langchain
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish:
    name: Publish to npm + GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-and-test, test-os, build, test-bun, embedder-e2e, wheels, sdist, test-python, python-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: packages/hive-db
        run: bun install --frozen-lockfile

      - name: Create npm dirs
        working-directory: packages/hive-db
        run: bunx napi create-npm-dirs

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/hive-db/artifacts

      - name: Move artifacts into npm dirs
        working-directory: packages/hive-db
        run: bunx napi artifacts

      - name: Copy native loader to package root
        working-directory: packages/hive-db
        shell: bash
        run: cp artifacts/bindings-linux-x64-gnu/native.cjs ./native.cjs

      - name: List npm dirs
        working-directory: packages/hive-db
        shell: bash
        run: ls -R ./npm

      # Idempotente a propósito: si un release falla a medias, los paquetes de
      # plataforma que sí llegaron a npm quedan publicados, y al reintentar el
      # `npm publish` de esos devuelve 409 y tumbaba el job entero. Se salta lo
      # que ya está en el registry en vez de darlo por error.
      #
      # El `set -euo pipefail` tampoco es decorativo: sin él, un fallo a mitad
      # del bucle se tragaba en silencio porque el exit code del step es el del
      # último comando.
      - name: Publish platform packages
        working-directory: packages/hive-db
        shell: bash
        run: |
          set -euo pipefail
          for triple in linux-x64-gnu linux-x64-musl linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64-msvc; do
            name=$(node -p "require('./npm/${triple}/package.json').name")
            version=$(node -p "require('./npm/${triple}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "· ${name}@${version} ya está publicado — se omite"
            else
              npm publish "./npm/${triple}" --access public
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build TypeScript
        working-directory: packages/hive-db
        run: bun run tsc -p tsconfig.json

      - name: Publish main package
        working-directory: packages/hive-db
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            packages/hive-db/npm/**/*.node
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}