[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "johpaz-langchain-hivedb"
version = "0.1.0"
description = "Adaptadores de LangChain y LangGraph para HiveDB: VectorStore, historial de chat y BaseStore de memoria a largo plazo."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "John Paez" }]
requires-python = ">=3.9"
dependencies = [
  "johpaz-hive-db>=0.7.0",
  "langchain-core>=0.3",
]
keywords = ["langchain", "langgraph", "agents", "memory", "vector-store", "hivedb"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
# `HiveDBStore` (BaseStore de LangGraph) vive en `langgraph-checkpoint`.
langgraph = ["langgraph-checkpoint>=2.1"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "langchain-tests>=0.3", "langgraph>=1.0"]

[project.urls]
Repository = "https://github.com/johpaz/hive-db"

[tool.hatch.build.targets.wheel]
packages = ["langchain_hivedb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
